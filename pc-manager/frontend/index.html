<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>PC Manager</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div id="app">

        <header>
            <span id="clock">00:00</span>

            <div class="header-actions">
                <button id="fullscreen-button" class="wallpaper-button" onclick="toggleFullscreen()">Tela cheia</button>
                <div class="status-pill"><span class="status-dot"></span>PC Manager</div>
            </div>
        </header>

        <main>

            <section class="dashboard-heading">
                <div>
                    <span class="eyebrow">CENTRAL DE CONTROLE</span>
                    <h1>Seu computador, no seu ritmo.</h1>
                </div>
                <button class="wallpaper-button" onclick="document.getElementById('wallpaper-input').click()">Trocar fundo</button>
                <input id="wallpaper-input" type="file" accept="image/*" hidden>
            </section>

            <section class="control-grid">
                <div class="control-panel">
                    <span class="panel-label">NOTIFICAÇÕES</span>
                    <h2>Deixe o Windows quieto.</h2>
                    <div class="panel-actions">
                        <button class="text-button" onclick="openNotifications()">Configurar notificações</button>
                        <button class="text-button secondary" onclick="openFocusSettings()">Modo foco</button>
                    </div>
                </div>

                <div class="control-panel volume-panel">
                    <span class="panel-label">ÁUDIO</span>
                    <div class="volume-row">
                        <button class="icon-button" onclick="changeVolume(-1)" aria-label="Diminuir volume">-</button>
                        <div class="volume-readout"><strong id="volume">100%</strong><span>volume do sistema</span></div>
                        <button class="icon-button" onclick="changeVolume(1)" aria-label="Aumentar volume">+</button>
                    </div>
                    <button class="text-button" onclick="toggleMute()">Silenciar / ativar som</button>
                </div>

                <div class="control-panel media-panel">
                    <span class="panel-label">MÚSICA</span>
                    <h2>Controle sua reprodução.</h2>
                    <div class="media-controls">
                        <button class="icon-button" onclick="previous()" aria-label="Música anterior">|&lt;</button>
                        <button class="icon-button play-button" onclick="playPause()" aria-label="Pausar ou reproduzir">&#9654;</button>
                        <button class="icon-button" onclick="next()" aria-label="Próxima música">&gt;|</button>
                    </div>
                </div>
            </section>

            <section id="shortcuts">

                <div
                    id="shortcut-grid"
                    class="shortcut-grid"
                ></div>

            </section>

        </main>

    </div>

    <script src="/js/app.js"></script>
    <script src="/js/media.js"></script>
    <script src="/js/shortcuts.js"></script>

</body>

</html>
